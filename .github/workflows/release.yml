# Both jobs share a main-triggered run: GITHUB_TOKEN tags cannot start workflows.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          # This checkout intentionally pushes derived files onto the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync derived version files into the release PR
        if: ${{ steps.release.outputs.pr }}
        run: |
          ./scripts/sync-version.sh
          if [ -z "$(git status --porcelain)" ]; then
            echo "derived files already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths include newly generated (previously untracked) notes.
          git add app/build.gradle.kts fastlane/metadata/android/*/changelogs/
          git commit -m "chore: sync versionCode and store release notes"
          git push

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Check derived version files
        run: ./scripts/sync-version.sh --check

      - name: Check release signing configuration
        id: targets
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          signing=$([ -n "$KEYSTORE" ] && echo true || echo false)
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "signing=$signing" >> "$GITHUB_STEP_SUMMARY"
          [ "$signing" = true ] || echo "::warning::No release key; source-only release, binary publishing skipped."

      - name: Restore the signing keystore
        if: steps.targets.outputs.signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" > /dev/null

      - name: Build the signed APK
        if: steps.targets.outputs.signing == 'true'
        env:
          DRUMS_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          DRUMS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DRUMS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DRUMS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Collect artifacts
        if: steps.targets.outputs.signing == 'true'
        id: artifacts
        run: |
          eval "$(./scripts/sync-version.sh --print)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/drums-${version}.apk"
          (cd dist && sha256sum "drums-${version}.apk" > "drums-${version}.apk.sha256")
          echo "apk=dist/drums-${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Attach APK to GitHub Release
        if: steps.targets.outputs.signing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
          APK: ${{ steps.artifacts.outputs.apk }}
        run: gh release upload "$TAG" "$APK" "$APK.sha256" --clobber

      # Play is deliberately absent; decide it with paid packs in M7.
      - name: Publish self-hosted F-Droid repository
        if: steps.targets.outputs.signing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          FDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          FDROID_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APK: ${{ steps.artifacts.outputs.apk }}
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install --quiet fdroidserver==2.4.5
          PATH="$RUNNER_TEMP/fdroid-venv/bin:$PATH" ./scripts/fdroid-publish.sh "$APK"
